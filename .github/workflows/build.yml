name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Diagnose app and runtime lint
        shell: bash
        run: |
          set +e
          npm run lint -- --ignore-pattern 'database/**' 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > lint.exit
          exit 0

      - name: Diagnose app and runtime type check
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > typecheck.exit
          exit 0

      - name: Diagnose Functions source check
        shell: bash
        run: |
          set +e
          npm --prefix functions run check 2>&1 | tee functions-check.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > functions-check.exit
          exit 0

      - name: Upload source validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-validation-diagnostics-${{ github.run_id }}
          path: |
            lint.log
            lint.exit
            typecheck.log
            typecheck.exit
            functions-check.log
            functions-check.exit
          if-no-files-found: error
          retention-days: 3

      - name: Enforce source validation results
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for check in lint typecheck functions-check; do
            status=$(cat "${check}.exit")
            echo "${check} exit code: ${status}"
            if [[ "$status" != "0" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Validate non-secret runtime environment
        run: npm run runtime:validate

      - name: Validate reproducible runtime package
        run: npm run runtime:package-check

      - name: Validate versioned database package
        run: npm run database:validate

      - name: Validate protected Firebase release package
        run: |
          npm run firebase-release:validate
          npm run firebase-release:test

      - name: Validate core mission lifecycle UX
        run: npm run mission:quality-check

      - name: Repository product boundary check
        run: node scripts/wellfit-dev-agent/src/repository-inventory-check.mjs

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NODE_OPTIONS: --max-old-space-size=768

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: build.log
          if-no-files-found: warn
          retention-days: 3
