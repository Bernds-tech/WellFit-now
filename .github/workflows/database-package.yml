name: Database Package Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm --prefix functions ci --prefer-offline --no-audit --no-fund

      - name: Validate database manifests and execution guards
        run: npm run database:validate

      - name: Check database JavaScript syntax
        run: npm --prefix functions run database:check

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm --prefix functions ci --prefer-offline --no-audit --no-fund

      - name: Run database migrations and seeds against emulator
        run: >-
          npx firebase emulators:exec
          --only firestore
          --project demo-no-project
          "npm --prefix functions run database:emulator"
