name: Container Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release_artifact:
        description: Create a portable Docker image archive and release manifest
        required: true
        type: boolean
        default: false
      release_channel:
        description: Non-secret release channel label
        required: true
        type: choice
        options:
          - staging-candidate
          - production-candidate
        default: staging-candidate

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone image without deployment
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: wellfit-web:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start isolated container
        shell: bash
        run: |
          docker run --detach \
            --name wellfit-web-ci \
            --publish 127.0.0.1:3000:3000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env WELLFIT_RUNTIME_MODE=container-ci \
            --env WELLFIT_RELEASE_SHA=${{ github.sha }} \
            --env WELLFIT_RELEASE_CHANNEL=ci \
            wellfit-web:ci-${{ github.sha }}

      - name: Verify hardened runtime and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker exec wellfit-web-ci id -u)" = "1001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' wellfit-web-ci)" = "true"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/health > health.json; then
              break
            fi
            sleep 1
          done
          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
            if (health.status !== "ok") throw new Error("health status is not ok");
            if (health.service !== "wellfit-web") throw new Error("unexpected service name");
            if (health.release.sha !== process.env.GITHUB_SHA) throw new Error("release SHA mismatch");
            if (health.deploymentPerformedByEndpoint !== false) throw new Error("health endpoint must never deploy");
            if (health.databaseWritePerformedByEndpoint !== false) throw new Error("health endpoint must never write data");
          '

      - name: Verify materialized landing hero asset
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail http://127.0.0.1:3000/ > landing.html
          grep -Fq 'reference-v12-materialized-composite' landing.html

          curl --silent --show-error --fail \
            http://127.0.0.1:3000/landing/hero-composite-v12.webp \
            > hero-composite-v12.webp
          test "$(head -c 4 hero-composite-v12.webp)" = "RIFF"
          test "$(dd if=hero-composite-v12.webp bs=1 skip=8 count=4 status=none)" = "WEBP"
          test "$(wc -c < hero-composite-v12.webp)" -eq 21936
          test "$(sha256sum hero-composite-v12.webp | cut -d' ' -f1)" = "b24ac57ea55bd9010bd2380bab1a5b2cdfb04083ce971bd795e844622893dfcf"

      - name: Create portable release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release_artifact }}
        shell: bash
        env:
          WELLFIT_RELEASE_SHA: ${{ github.sha }}
          WELLFIT_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          WELLFIT_IMAGE_TAG: wellfit-web:${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          docker save wellfit-web:ci-${{ github.sha }} | gzip -9 > release/wellfit-web-${{ github.sha }}.tar.gz
          node scripts/runtime/create-release-manifest.mjs \
            --sha=${{ github.sha }} \
            --channel=${{ inputs.release_channel }} \
            --image-tag=wellfit-web:${{ github.sha }} \
            --output=release/wellfit-release-manifest.json
          sha256sum \
            release/wellfit-web-${{ github.sha }}.tar.gz \
            release/wellfit-release-manifest.json \
            > release/SHA256SUMS

      - name: Upload portable release candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: wellfit-runtime-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Container diagnostics
        if: always()
        shell: bash
        run: |
          docker ps --all || true
          docker logs wellfit-web-ci || true
          test ! -f health.json || cat health.json
          test ! -f landing.html || grep -o 'reference-v[0-9][^" ]*' landing.html | head -n 1 || true
          test ! -f hero-composite-v12.webp || ls -lh hero-composite-v12.webp || true

      - name: Stop isolated container
        if: always()
        run: docker rm --force wellfit-web-ci || true
