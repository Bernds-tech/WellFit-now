      <stop offset=".46" stop-color="#07303a"/>
      <stop offset=".78" stop-color="#0b4a4d"/>
      <stop offset="1" stop-color="#1a352d"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="36%" r="45%">
      <stop offset="0" stop-color="#ffd85b" stop-opacity=".58"/>
      <stop offset=".28" stop-color="#ff9f2f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff7d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0b4a4d"/>
      <stop offset="1" stop-color="#03171d"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163f3d"/>
      <stop offset=".55" stop-color="#8b6a37"/>
      <stop offset="1" stop-color="#ffd65d"/>
    </linearGradient>
