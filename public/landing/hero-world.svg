<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WellFit Abenteuerwelt</title>
  <desc id="desc">Eine dunkle türkisfarbene Abenteuerlandschaft mit Waldpfad, leuchtenden Wegpunkten und einer Stadt am Horizont.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
